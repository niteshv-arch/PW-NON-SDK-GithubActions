name: BrowserStack Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browserstack-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright-browserstack/package-lock.json

      - name: Install dependencies
        working-directory: playwright-browserstack
        run: npm install

      - name: Run Playwright tests on BrowserStack
        working-directory: playwright-browserstack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: npx playwright test
